   name: Node.js CI/CD Pipeline

   # Trigger the workflow on push and pull requests to main branch
   on:
     push:
       branches: [ main, develop ]
     pull_request:
       branches: [ main ]

   jobs:
     # Job 1: Build and Test
     test:
       runs-on: ubuntu-latest
       
       strategy:
         matrix:
           node-version: [14.x, 16.x, 18.x]
       
       steps:
       # Step 1: Checkout repository code
       - name: Checkout code
         uses: actions/checkout@v3
         
       # Step 2: Setup Node.js environment
       - name: Setup Node.js ${{ matrix.node-version }}
         uses: actions/setup-node@v3
         with:
           node-version: ${{ matrix.node-version }}
           cache: 'npm'
           
       # Step 3: Install dependencies
       - name: Install dependencies
         run: npm ci
         
       # Step 4: Run build script
       - name: Run build
         run: npm run build --if-present
         
       # Step 5: Run tests
       - name: Run tests
         run: npm test
         
       # Step 6: Generate test coverage (optional)
       - name: Generate test coverage
         run: npm run test -- --coverage --watchAll=false
         if: matrix.node-version == '18.x'

     # Job 2: Code Quality Checks
     lint:
       runs-on: ubuntu-latest
       needs: test
       
       steps:
       - name: Checkout code
         uses: actions/checkout@v3
         
       - name: Setup Node.js
         uses: actions/setup-node@v3
         with:
           node-version: '18.x'
           cache: 'npm'
           
       - name: Install dependencies
         run: npm ci
         
       # Add linting step (requires eslint to be installed)
       - name: Run linter
         run: echo "Linting step - install ESLint for actual linting"

     # Job 3: Security Audit
     security:
       runs-on: ubuntu-latest
       needs: test
       
       steps:
       - name: Checkout code
         uses: actions/checkout@v3
         
       - name: Setup Node.js
         uses: actions/setup-node@v3
         with:
           node-version: '18.x'
           cache: 'npm'
           
       - name: Install dependencies
         run: npm ci
         
       - name: Run security audit
         run: npm audit --audit-level=moderate

     # Job 4: Deploy (runs only on main branch)
     deploy:
       runs-on: ubuntu-latest
       needs: [test, lint, security]
       if: github.ref == 'refs/heads/main'
       
       steps:
       - name: Checkout code
         uses: actions/checkout@v3
         
       - name: Setup Node.js
         uses: actions/setup-node@v3
         with:
           node-version: '18.x'
           cache: 'npm'
           
       - name: Install dependencies
         run: npm ci
         
       - name: Build application
         run: npm run build --if-present
         
       - name: Deploy to staging
         run: |
           echo "Deploying to staging environment..."
           echo "Application deployed successfully!"s